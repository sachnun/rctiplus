name: Build APK

on:
  push:
    branches: [main]
    paths: ['packages/apk/**', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['packages/apk/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Secrets are set per environment:
    # Settings -> Environments -> production
    environment: production
    concurrency:
      group: apk-build
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Toolchain (JDK 17 + Android SDK 35 + Gradle 8.11.1) is defined once in
      # the APK Dockerfile so CI and local `build-apk.sh` stay in sync.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build SDK image (cached)
        uses: docker/build-push-action@v7
        env:
          # Don't upload the Docker Desktop build record as a run artifact.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: packages/apk
          file: packages/apk/Dockerfile.build
          push: false
          load: true
          tags: rctiplus-android-build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assemble debug APK
        run: |
          docker run --rm \
            -v "${PWD}/packages/apk:/src" \
            -w /src \
            rctiplus-android-build \
            bash -lc 'gradle --no-daemon assembleDebug'

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: rctiplus-debug-apk
          path: packages/apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error